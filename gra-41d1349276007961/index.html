<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Steve Lamb: Splice Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap">
<style>
/* Layout: full-screen side-scrolling canvas, HUD strip on top, splice tray slides up from the bottom. */
:root {
  --night: #0a1624;
  --panel: #12233a;
  --panel-2: #1a3150;
  --ink: #e9f0f7;
  --muted: #8ea5bd;
  --hivis: #ffd23f;
  --laser: #ff4d3d;
  --glow: #5ff2ff;
  --good: #47e08a;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; background: var(--night); }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--night); color: var(--ink);
  font-family: var(--body); font-size: 15px;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--hivis); outline-offset: 2px; }

#app { height: 100%; position: relative; overflow: hidden; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD */
.hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center;
}
.hud .where { min-width: 0; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--hivis); }
.place { font-family: var(--display); font-weight: 900; font-size: 24px; line-height: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.stats { display: flex; gap: 10px; align-items: center; font-family: var(--mono); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.hats { letter-spacing: 1px; }
.hats .lost { opacity: .22; filter: grayscale(1); }
.mute { pointer-events: auto; border: 0; background: rgba(18,35,58,.8); border-radius: 8px; width: 34px; height: 30px; font-size: 15px; }
.route { grid-column: 1 / -1; height: 10px; background: rgba(18,35,58,.85); border-radius: 5px; position: relative; }
.route .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: linear-gradient(90deg, var(--glow), var(--hivis)); width: 0; }
.route .brk { position: absolute; top: -3px; width: 4px; height: 16px; margin-left: -2px; background: var(--laser); border-radius: 2px; }
.route .brk.ok { background: var(--good); }
.route .me { position: absolute; top: -5px; width: 12px; height: 20px; margin-left: -6px; border-radius: 4px; background: var(--hivis); box-shadow: 0 0 0 2px var(--night); }
.tip { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 4; font-family: var(--mono); font-size: 13px; color: var(--ink); background: rgba(10,22,36,.75); padding: 8px 14px; border-radius: 999px; pointer-events: none; white-space: nowrap; transition: opacity .4s; }

/* Splice tray */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  background: rgba(11,24,40,.97); border-top: 3px solid var(--hivis); border-radius: 18px 18px 0 0;
  padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 -20px 40px rgba(0,0,0,.5);
  animation: rise .25s ease-out;
}
.sheet-inner { width: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.sheet.shake { animation: shake .35s; }
.sheet-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sheet-top h3 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 22px; text-transform: uppercase; }
.sheet-top span { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tbar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--good); }
.ask { margin: 0; font-size: 16px; text-align: center; text-wrap: balance; line-height: 1.6; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; border-radius: 999px; background: var(--panel-2); font-family: var(--mono); font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
.picks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pick { border: 0; border-radius: 12px; background: var(--panel); padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.pick i { width: 100%; max-width: 54px; height: 12px; border-radius: 6px; background: var(--c); box-shadow: 0 0 0 1px rgba(255,255,255,.25), 0 0 10px var(--c); }
.pick:active { transform: scale(.95); }
.pick.bad { animation: shake .35s; background: rgba(255,77,61,.3); }
.pick.used { visibility: hidden; }
.scope { height: 92px; border-radius: 12px; background: #050d17; position: relative; overflow: hidden; border: 1px solid var(--panel-2); }
.scope .cross { position: absolute; left: 0; right: 0; top: 50%; height: 0; border-top: 1px dashed rgba(95,242,255,.35); }
.scope .f { position: absolute; top: 50%; height: 12px; margin-top: -6px; background: var(--c); width: 44%; box-shadow: 0 0 10px var(--c); }
.scope .f.l { left: 0; border-radius: 0 6px 6px 0; }
.scope .f.r { right: 0; border-radius: 6px 0 0 6px; }
.scope.fused .f.l, .scope.fused .f.r { width: 50%; transition: width .15s; }
.scope .arc { position: absolute; left: 50%; top: 50%; width: 90px; height: 90px; margin: -45px; border-radius: 50%; background: radial-gradient(circle, #fff 0, var(--glow) 22%, transparent 65%); opacity: 0; }
.scope.fused .arc { animation: arc .5s; }
.scope .xy { position: absolute; left: 8px; top: 6px; font-family: var(--mono); font-size: 10px; color: var(--glow); opacity: .8; }
.scope .off { position: absolute; right: 8px; top: 6px; font-family: var(--mono); font-size: 10px; color: var(--glow); font-variant-numeric: tabular-nums; }
.fuse-btn { border: 0; border-radius: 12px; padding: 16px; background: var(--hivis); color: #1a1400; font-family: var(--display); font-weight: 900; font-size: 28px; letter-spacing: .06em; text-transform: uppercase; }
.fuse-btn:active { transform: scale(.98); }
.dots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.dots span { width: 18px; height: 18px; border-radius: 50%; background: var(--panel-2); border: 2px solid transparent; }
.dots span.cur { border-color: var(--hivis); }
.dots span.ok { background: var(--c); }
.msg { min-height: 20px; text-align: center; font-family: var(--mono); font-size: 13px; }

/* Full-screen cards */
.screen { position: absolute; inset: 0; z-index: 30; background: rgba(10,22,36,.94); overflow-y: auto; }
.screen-inner { min-height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding-block: 24px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.screen h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(50px, 15vw, 80px); line-height: .88; text-transform: uppercase; text-wrap: balance; }
.screen h1 span { color: var(--hivis); display: block; }
.screen h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 42px; line-height: .95; text-transform: uppercase; text-wrap: balance; }
.screen p { margin: 0; font-size: 17px; line-height: 1.45; }
.screen p.small { font-size: 14px; color: var(--muted); }
.speech { background: var(--panel); border-radius: 14px; padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; }
.speech svg { flex: none; width: 60px; height: 60px; }
.speech .who { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--hivis); margin-bottom: 4px; }
.speech p { font-size: 16px; }
.howto { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; background: var(--panel); border-radius: 14px; padding: 14px 16px; font-size: 15px; }
.howto b { font-family: var(--mono); font-size: 12px; color: var(--night); background: var(--hivis); border-radius: 6px; padding: 3px 8px; text-align: center; }
.specs { display: flex; flex-wrap: wrap; gap: 8px; }
.specs span { font-family: var(--mono); font-size: 12px; padding: 6px 10px; border-radius: 999px; background: var(--panel-2); }
.cta { align-self: stretch; border: 0; border-radius: 14px; padding: 18px; background: var(--hivis); color: #1a1400; font-family: var(--display); font-weight: 900; font-size: 26px; letter-spacing: .05em; text-transform: uppercase; }
.cta.ghost { background: transparent; color: var(--ink); border: 2px solid var(--panel-2); font-size: 20px; padding: 12px; }
.stars { font-size: 44px; letter-spacing: .1em; color: var(--hivis); }
.stars .off { color: var(--panel-2); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.checks li { display: flex; gap: 10px; align-items: center; }
.checks li::before { content: "✕"; width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--panel-2); color: var(--muted); }
.checks li.y::before { content: "✓"; background: var(--good); color: #04220f; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.levels div { background: var(--panel); border-radius: 10px; padding: 8px 6px; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.levels div b { display: block; font-family: var(--display); font-size: 22px; color: var(--ink); }
.levels div .s { color: var(--hivis); letter-spacing: .05em; }
.brand { font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.brand::before { content: ""; width: 28px; height: 3px; background: linear-gradient(90deg, var(--glow), var(--hivis)); border-radius: 2px; }

.toast { position: absolute; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); z-index: 40; transform: translateX(-50%); width: min(92%, 420px); background: var(--laser); color: #fff; font-weight: 600; text-align: center; padding: 10px 14px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.4); pointer-events: none; animation: toast 2.2s forwards; }
.toast.ok { background: var(--good); color: #04220f; }
.toast.warn { background: var(--hivis); color: #1a1400; }

@keyframes rise { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
@keyframes arc { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; transform: scale(1.4); } 100% { opacity: 0; transform: scale(1); } }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 10%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet, .toast, .scope .arc { animation-duration: .01s !important; } }
</style>

<div id="app">
  <canvas id="game"></canvas>

  <div class="hud" id="hud">
    <div class="where"><div class="eyebrow" id="lvlLabel">Job 1 of 3</div><div class="place" id="placeLabel">Elm Road</div></div>
    <div class="stats"><span class="hats" id="hats"></span><span id="coffee">☕ 0</span><span id="score">0</span><button class="mute" id="mute" aria-label="Sound on or off">🔊</button></div>
    <div class="route" id="route"><div class="fill" id="routeFill"></div></div>
  </div>
  <div class="tip" id="tip">Tap anywhere to jump · tap again in the air to double jump</div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-inner">
      <div class="sheet-top"><h3 id="spTitle">Splice tray</h3><span id="spInfo">Break 1 of 3</span></div>
      <div class="tbar"><i id="spBar"></i></div>
      <div id="stepPick">
        <p class="ask" id="ask"></p>
        <div class="picks" id="picks"></div>
      </div>
      <div id="stepAlign" hidden>
        <div class="scope" id="scope"><div class="cross"></div><span class="xy">ALIGN CORES</span><span class="off" id="offTxt">Y +0.0 µm</span><div class="f l"></div><div class="f r" id="fR"></div><div class="arc"></div></div>
      </div>
      <button class="fuse-btn" id="fuseBtn" hidden>Fuse</button>
      <div class="dots" id="dots"></div>
      <div class="msg" id="spMsg"></div>
    </div>
  </div>

  <div class="screen" id="screen"></div>
</div>

<script>
(function () {
  "use strict";

  // TIA-598 fibre colour code, positions 1–12
  const COLORS = [
    { n: "Blue", a: "BL", c: "#2f6bff" }, { n: "Orange", a: "OR", c: "#ff8a1f" },
    { n: "Green", a: "GN", c: "#2fbf4a" }, { n: "Brown", a: "BR", c: "#a0662f" },
    { n: "Slate", a: "SL", c: "#8b9aab" }, { n: "White", a: "WH", c: "#f4f4f0" },
    { n: "Red", a: "RD", c: "#e8423a" }, { n: "Black", a: "BK", c: "#262626" },
    { n: "Yellow", a: "YL", c: "#ffd60a" }, { n: "Violet", a: "VI", c: "#9b5cff" },
    { n: "Rose", a: "RS", c: "#ff8fb8" }, { n: "Aqua", a: "AQ", c: "#2ee6e6" }
  ];

  const LEVELS = [
    { place: "Elm Road", title: "Street run", breaks: 3, fibres: 4, speed: 250, align: 1.0, perFibre: 7,
      obstacles: ["cone", "puddle", "barrier"], who: "Dispatch",
      text: "Steve, the storm has cut the cable along Elm Road in three places. Follow the cable from the exchange, jump over the road works and fix every break. Each fix lights up the next row of houses." },
    { place: "Mill Lane", title: "Rainy night", breaks: 4, fibres: 6, speed: 290, align: 1.3, perFibre: 6, rain: true,
      obstacles: ["cone", "puddle", "barrier", "dog"], who: "Dispatch",
      text: "Mill Lane now. It's chucking it down, there are four breaks and Mrs. Patel's dog has escaped again. He doesn't like hi-vis. Six fibres in every cable." },
    { place: "St. Lumen Hospital", title: "The digger", breaks: 4, fibres: 8, speed: 330, align: 1.6, perFibre: 5.5,
      obstacles: ["cone", "barrier", "dog", "digger", "puddle"], who: "Dispatch",
      text: "Big one, Steve. The digger that started all this is still driving around the hospital road. Eight fibres per break, the hospital is waiting. Get the light to St. Lumen." }
  ];

  const WRONG = [
    "Wrong fibre! The bank's traffic now goes to a kebab shop.",
    "Nope. That just sent Netflix to the vicar.",
    "Wrong colour! Somebody's smart fridge is now on police radio.",
    "Wrong pair. Grandma's video call now streams to a sheep farm.",
    "That's not the same colour, Steve. Glasses in the van again?"
  ];

  const $ = (id) => document.getElementById(id);
  const cv = $("game"), ctx = cv.getContext("2d");
  const sheet = $("sheet"), screen = $("screen");

  let W = 0, H = 0, DPR = 1, GY = 0;     // canvas size and ground line
  let G = null;                           // current game state
  let best = loadBest();
  let audio = null, muted = false, musicTimer = null, step = 0, noiseBuf = null;
  let lastT = performance.now(), clock = 0;
  const stars = [];
  for (let i = 0; i < 70; i++) stars.push([Math.random(), Math.random() * .55, Math.random() * 1.5 + .3]);
  const skyline = [];
  for (let x = 0; x < 2400;) { const w = 40 + Math.random() * 70; skyline.push([x, w, 40 + Math.random() * 110]); x += w + 6; }

  // ---------- storage ----------
  function loadBest() { try { return JSON.parse(localStorage.getItem("steveLambBest2") || "[]"); } catch (e) { return []; } }
  function saveBest() { try { localStorage.setItem("steveLambBest2", JSON.stringify(best)); } catch (e) {} }

  // ---------- sound ----------
  function initAudio() {
    if (audio) { if (audio.state === "suspended") audio.resume(); return; }
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = audio.createBuffer(1, audio.sampleRate * .2, audio.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { audio = null; }
  }
  function tone(freq, dur, type, vol, when, slideTo) {
    if (!audio || muted) return;
    try {
      const t = audio.currentTime + (when || 0);
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || .06, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  function noise(dur, vol) {
    if (!audio || muted || !noiseBuf) return;
    try {
      const s = audio.createBufferSource(), g = audio.createGain(), f = audio.createBiquadFilter();
      s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = 6000;
      g.gain.setValueAtTime(vol, audio.currentTime); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + dur);
      s.connect(f).connect(g).connect(audio.destination); s.start(); s.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  const SFX = {
    jump: () => tone(380, .14, "square", .05, 0, 760),
    jump2: () => tone(560, .12, "square", .05, 0, 1100),
    coffee: () => { tone(988, .08, "square", .05); tone(1319, .14, "square", .05, .07); },
    hit: () => { tone(220, .3, "sawtooth", .09, 0, 70); noise(.15, .1); },
    pick: () => tone(660, .06, "triangle", .07),
    wrong: () => tone(150, .25, "sawtooth", .08),
    arc: () => { noise(.12, .14); tone(1800, .1, "sine", .05); },
    lit: () => [523, 659, 784, 1047].forEach((f, k) => tone(f, .18, "triangle", .07, k * .08)),
    bark: () => { tone(420, .07, "sawtooth", .06, 0, 260); tone(420, .07, "sawtooth", .06, .12, 260); },
    win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, k) => tone(f, .2, "square", .05, k * .11)),
    lose: () => [392, 330, 262, 196].forEach((f, k) => tone(f, .25, "sawtooth", .06, k * .16))
  };
  // tiny chiptune bassline while running
  const BASS = [110, 0, 110, 131, 0, 147, 131, 0, 98, 0, 98, 117, 0, 131, 147, 165];
  function startMusic() {
    stopMusic();
    musicTimer = setInterval(() => {
      if (!G || G.state !== "run" || muted || !audio) return;
      const f = BASS[step % 16];
      if (f) tone(f, .16, "triangle", .09);
      if (step % 2 === 0) noise(.03, .025);
      if (step % 8 === 4) tone(60, .12, "sine", .12, 0, 40);
      step++;
    }, 140);
  }
  function stopMusic() { if (musicTimer) clearInterval(musicTimer); musicTimer = null; }
  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

  // ---------- helpers ----------
  const rnd = (a, b) => a + Math.random() * (b - a);
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function toast(msg, kind) {
    const el = document.createElement("div");
    el.className = "toast" + (kind ? " " + kind : "");
    el.textContent = msg;
    $("app").appendChild(el);
    setTimeout(() => el.remove(), 2300);
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = $("app").getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    GY = groundTarget();
  }

  function groundTarget() {
    if (G && G.state === "splice" && !sheet.hidden) return Math.max(150, Math.min(H * .62, H - sheet.offsetHeight - 50));
    return Math.round(H * .62);
  }

  // ---------- level building ----------
  function makeObstacle(type, x) {
    switch (type) {
      case "cone": return { type, x, w: 24, h: 34 };
      case "puddle": return { type, x, w: 74, h: 8 };
      case "barrier": return { type, x, w: 46, h: 44 };
      case "dog": return { type, x, w: 42, h: 30, run: 0, barked: false };
      case "digger": return { type, x, w: 96, h: 66 };
    }
  }
  function buildLevel(L) {
    const obs = [], items = [], houses = [], breaks = [];
    let x = 420;

  // ---------- update ----------

    sky.addColorStop(0, "#050c18"); sky.addColorStop(1, "#13294a");
    ctx.fillStyle = sky; ctx.fillRect(-10, -10, W + 20, GY + 10);
    stars.forEach((s) => { ctx.fillStyle = "rgba(233,240,247," + (.4 + .4 * Math.sin(t * 2 + s[0] * 20)) + ")"; ctx.fillRect(((s[0] * W * 1.3 - cam * .03) % W + W) % W, s[1] * GY, s[2], s[2]); });
    ctx.fillStyle = "#f3eccf"; ctx.beginPath(); ctx.arc(W * .82, GY * .2, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#050c18"; ctx.beginPath(); ctx.arc(W * .82 + 7, GY * .2 - 4, 16, 0, Math.PI * 2); ctx.fill();

    // far skyline
    ctx.fillStyle = "#0f2038";
    skyline.forEach((b) => { let x = ((b[0] - cam * .25) % 2400 + 2400) % 2400 - 200; if (x < W + 100) { ctx.fillRect(x, GY - 30 - b[2], b[1], b[2] + 30); } });

    if (G) {
      // houses
      G.houses.forEach((h) => {
        const x = h.x - cam;
        if (x < -120 || x > W + 120) return;
        const top = GY - 26 - h.h;
        ctx.fillStyle = "#1a3150"; ctx.fillRect(x, top, h.w, h.h);
        if (h.roof) { ctx.beginPath(); ctx.moveTo(x - 6, top); ctx.lineTo(x + h.w / 2, top - 26); ctx.lineTo(x + h.w + 6, top); ctx.closePath(); ctx.fillStyle = "#223a5e"; ctx.fill(); }
        const ww = 12, gap = (h.w - h.win * ww) / (h.win + 1);
        for (let r = 0; r < 2; r++) for (let c = 0; c < h.win; c++) {
          const wx = x + gap + c * (ww + gap), wy = top + 12 + r * 26;
          if (wy + 14 > GY - 28) continue;
          if (h.lit > 0) {
            ctx.fillStyle = "rgba(255,210,63," + (.25 * h.lit) + ")"; ctx.fillRect(wx - 5, wy - 5, ww + 10, 24);
            ctx.fillStyle = "rgba(255,214,90," + h.lit + ")";
          } else ctx.fillStyle = "#0b182a";
          ctx.fillRect(wx, wy, ww, 14);
        }
        if (h.lit > 0 && h.lit < 1) { ctx.fillStyle = "rgba(95,242,255," + (1 - h.lit) * .5 + ")"; ctx.fillRect(x - 4, top - 4, h.w + 8, h.h + 8); }
      });
      // exchange building at start
      const ex = 0 - cam;
      if (ex > -200) {
        ctx.fillStyle = "#223a5e"; ctx.fillRect(ex - 40, GY - 150, 150, 150);
        ctx.fillStyle = "#5ff2ff"; ctx.font = "bold 12px monospace"; ctx.textAlign = "left"; ctx.fillText("L3 OPTICS", ex - 26, GY - 128); ctx.fillText("EXCHANGE", ex - 26, GY - 112);
        for (let k = 0; k < 4; k++) { ctx.fillStyle = Math.floor(t * 3 + k) % 2 ? "#47e08a" : "#1a3150"; ctx.fillRect(ex - 24 + k * 22, GY - 90, 10, 6); }
      }
      // end building
      const ee = G.end - cam;
      if (ee < W + 220) {
        const lit = G.breaks.every((b) => b.done);
        ctx.fillStyle = "#223a5e"; ctx.fillRect(ee, GY - 180, 170, 180);
        ctx.fillStyle = lit ? "#ffd23f" : "#0b182a";
        for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) ctx.fillRect(ee + 16 + c * 38, GY - 160 + r * 36, 20, 18);
        ctx.fillStyle = lit ? "#e8423a" : "#3a4a60"; ctx.fillRect(ee + 74, GY - 210, 22, 30); ctx.fillRect(ee + 70, GY - 200, 30, 10);
        ctx.fillStyle = "#e9f0f7"; ctx.font = "bold 12px monospace"; ctx.textAlign = "left";
        ctx.fillText(G.i === 2 ? "ST. LUMEN HOSPITAL" : "STREET CABINET HUB", ee + 6, GY - 186 + (G.i === 2 ? 0 : 0));
      }
    }

    // ground
    ctx.fillStyle = "#2a3346"; ctx.fillRect(-10, GY, W + 20, 8);              // kerb
    ctx.fillStyle = "#1c2433"; ctx.fillRect(-10, GY + 8, W + 20, H - GY);    // road
    ctx.fillStyle = "rgba(233,240,247,.3)";
    for (let x = -((cam) % 80); x < W; x += 80) ctx.fillRect(x, GY + 78, 40, 4);

    if (G) {
      // cable in trench: lit part glows, broken ends spark
      const cy = GY + 26;
      const litEnd = G.litUntil - cam;
      ctx.lineWidth = 5; ctx.lineCap = "round";
      ctx.strokeStyle = "#0b182a"; ctx.beginPath(); ctx.moveTo(-10, cy); ctx.lineTo(W + 10, cy); ctx.stroke();
      ctx.strokeStyle = "#ff7a1a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-10, cy); ctx.lineTo(W + 10, cy); ctx.stroke();
      if (litEnd > -10) {
        ctx.strokeStyle = "rgba(95,242,255,.45)"; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(-10, cy); ctx.lineTo(Math.min(W + 10, litEnd), cy); ctx.stroke();
        ctx.fillStyle = "#e9ffff";
        for (let k = -2; k < W / 60 + 2; k++) {
          const px = k * 60 + ((t * 420 - cam) % 60 + 60) % 60;
          if (px < litEnd) { ctx.beginPath(); ctx.arc(px, cy, 2.6, 0, Math.PI * 2); ctx.fill(); }
        }
      }
      ctx.fillStyle = "#8ea5bd"; ctx.font = "10px monospace"; ctx.textAlign = "left";
      ctx.fillText("FIBRE ROUTE · 1550 nm", 10 - (cam % 600 < 0 ? 0 : 0), cy + 20);
      // breaks
      G.breaks.forEach((b, k) => {
        const x = b.x - cam;
        if (x < -80 || x > W + 80) return;
        ctx.fillStyle = "#0a111c"; ctx.fillRect(x - 22, GY + 8, 44, 34);                        // open pit
        ctx.fillStyle = "#3d4a5e"; ctx.fillRect(x + 24, GY - 3, 30, 4);                          // lifted lid
        if (!b.done) {
          ctx.fillStyle = "#0b182a"; ctx.fillRect(x - 6, cy - 6, 12, 12);
          if (Math.random() < .5) { ctx.fillStyle = Math.random() < .5 ? "#ff4d3d" : "#ffd23f"; ctx.fillRect(x - 8 + rnd(0, 16), cy - 8 + rnd(0, 10), 3, 3); }
          ctx.fillStyle = "#ff4d3d"; ctx.font = "bold 13px monospace"; ctx.textAlign = "center";
          if (Math.floor(t * 3) % 2) ctx.fillText("⚠ BREAK " + (k + 1), x, GY - 90);
          ctx.strokeStyle = "#ff4d3d"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, GY - 84); ctx.lineTo(x, GY - 10); ctx.stroke();
        } else {
          ctx.fillStyle = "#e9f0f7"; ctx.fillRect(x - 10, cy - 4, 20, 8);                        // splice closure
          ctx.fillStyle = "#47e08a"; ctx.font = "bold 12px monospace"; ctx.textAlign = "center"; ctx.fillText("✓ FIXED", x, GY - 12);
        }
      });
      // items
      G.items.forEach((it) => {
        if (it.got) return;
        const x = it.x - cam, y = GY - it.y + Math.sin(t * 4 + it.x) * 4;
        if (x < -30 || x > W + 30) return;
        ctx.fillStyle = "rgba(255,210,63,.18)"; ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#f4f4f0"; ctx.beginPath(); ctx.moveTo(x - 7, y - 9); ctx.lineTo(x + 7, y - 9); ctx.lineTo(x + 5, y + 9); ctx.lineTo(x - 5, y + 9); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#7a4a26"; ctx.fillRect(x - 8, y - 12, 16, 4);
        ctx.fillStyle = "#c7372c"; ctx.fillRect(x - 6, y - 2, 12, 4);
        ctx.strokeStyle = "rgba(233,240,247,.5)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 2, y - 15); ctx.quadraticCurveTo(x + 2 + Math.sin(t * 5) * 2, y - 20, x - 1, y - 26); ctx.stroke();
      });
      // obstacles
      G.obs.forEach((o) => { const x = o.x - cam; if (x > -140 && x < W + 140) drawObstacle(o, x, t); });

      // Steve
      const pose = G.state === "splice" ? "kneel" : G.state === "done" ? "cheer" : G.state === "run" ? "run" : "stand";
      const jumpY = G.state === "done" ? -Math.abs(Math.sin(G.doneT * 7)) * 30 : G.y;
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(G.sx - cam, GY + 2, 14 + G.y * .03, 4, 0, 0, Math.PI * 2); ctx.fill();
      drawSteve(G.sx - cam, GY + jumpY, t, pose);
      if (G.state === "splice") {
        const fx = G.sx - cam + 24;
        ctx.fillStyle = "#c7372c"; roundRect(fx, GY - 18, 26, 16, 3); ctx.fill();
        ctx.fillStyle = "#5ff2ff"; ctx.fillRect(fx + 4, GY - 15, 14, 8);
        if (Math.random() < .3) sparks(fx + 13, GY - 12, 1);
      }

      // particles + floating text
      G.parts.forEach((p) => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.fillRect(p.x - cam, p.y, p.s, p.s); });
      ctx.globalAlpha = 1;
      G.floats.forEach((f) => { ctx.globalAlpha = Math.min(1, f.life * 1.5); ctx.fillStyle = f.col; ctx.font = "900 20px 'Big Shoulders Display', Impact, sans-serif"; ctx.textAlign = "center"; ctx.fillText(f.text, f.x - cam, f.y); });
      ctx.globalAlpha = 1;

      // rain
      if (G.L.rain) {
        ctx.strokeStyle = "rgba(160,200,255,.35)"; ctx.lineWidth = 1;
        ctx.beginPath();
        G.rain.forEach((r) => { const x = ((r[0] * W * 1.2 - t * 120 - cam * .5) % (W * 1.2) + W * 1.2) % (W * 1.2) - 20; const y = ((r[1] * H + t * 700) % H); ctx.moveTo(x, y); ctx.lineTo(x - 5, y + 14); });
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function frame(now) {
    const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; clock += dt;
    if (!document.hidden) { update(dt); draw(clock); }
    requestAnimationFrame(frame);
  }

  // ---------- screens ----------
  const steveSVG = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#1a3150"/><path d="M14 64c0-12 8-18 18-18s18 6 18 18z" fill="#ffd23f"/><path d="M27 46h10v18H27z" fill="#12233a"/><rect x="17" y="54" width="30" height="3" fill="#e9f0f7" opacity=".8"/><circle cx="32" cy="32" r="12" fill="#e8b48f"/><path d="M18 26c0-9 6-14 14-14s14 5 14 14z" fill="#ffd23f"/><rect x="16" y="25" width="32" height="4" rx="2" fill="#e0b31e"/><circle cx="27.5" cy="33" r="1.8" fill="#1b1b1b"/><circle cx="36.5" cy="33" r="1.8" fill="#1b1b1b"/><path d="M27 38.5c3 2.5 7 2.5 10 0" stroke="#1b1b1b" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="32" y="23" font-size="5" text-anchor="middle" font-family="monospace" font-weight="700" fill="#1a1400">L3</text></svg>';
  const dispatchSVG = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#1a3150"/><rect x="18" y="20" width="28" height="22" rx="4" fill="#12233a" stroke="#5ff2ff" stroke-width="2"/><path d="M24 31h4l2-5 4 10 2-5h4" stroke="#5ff2ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="42" width="8" height="6" fill="#12233a"/><rect x="22" y="48" width="20" height="3" rx="1.5" fill="#8ea5bd"/></svg>';

  function show(html) { screen.innerHTML = '<div class="screen-inner">' + html + "</div>"; screen.hidden = false; screen.scrollTop = 0; }

  function levelGrid() {
    return '<div class="levels">' + LEVELS.map((L, i) => {
      const b = best[i] || 0;
      return "<div><b>" + (i + 1) + "</b>" + L.place.replace("St. Lumen ", "") + '<br><span class="s">' + "★".repeat(b) + '<span style="color:var(--panel-2)">' + "★".repeat(3 - b) + "</span></span></div>";
    }).join("") + "</div>";
  }

  function titleScreen() {
    G = null; stopMusic(); sheet.hidden = true;
    show(
      '<div class="brand">L3 Optics · Field Operations</div>' +
      "<h1>Steve Lamb<span>Splice Quest</span></h1>" +
      "<p>A storm has cut the fibre cable to Lumen Falls. Steve has to follow the cable route on foot, fix every break and bring the light back to the town.</p>" +
      '<div class="howto"><b>TAP</b><span>Jump. Tap again in the air for a double jump.</span>' +
      "<b>BREAK</b><span>Steve stops and opens the splice tray. Join fibre 1 to 1, 2 to 2 and so on, by colour.</span>" +
      "<b>FUSE</b><span>Tap when the two glass cores line up. Better line-up, lower loss, more points.</span>" +
      "<b>☕</b><span>Every 5 coffees gives back a lost hard hat.</span></div>" +
      levelGrid() +
      '<button class="cta" id="go">Start shift</button>'
    );
    $("go").onclick = () => { initAudio(); SFX.pick(); storyScreen(firstUnfinished()); };
  }
  function firstUnfinished() { for (let i = 0; i < LEVELS.length; i++) if (!best[i]) return i; return 0; }

  function storyScreen(i) {
    const L = LEVELS[i];
    show(
      '<div class="eyebrow">Job ' + (i + 1) + " of " + LEVELS.length + " · " + L.title + "</div>" +
      "<h2>" + L.place + "</h2>" +
      '<div class="speech">' + dispatchSVG + '<div><div class="who">' + L.who + "</div><p>" + L.text + "</p></div></div>" +
      '<div class="specs"><span>' + L.breaks + " breaks</span><span>" + L.fibres + " fibres each</span>" + (L.rain ? "<span>Rain</span>" : "") +
      (L.obstacles.includes("dog") ? "<span>Loose dog</span>" : "") + (L.obstacles.includes("digger") ? "<span>Digger</span>" : "") + "</div>" +
      '<button class="cta" id="go">Grab the van keys</button>' +
      '<button class="cta ghost" id="back">Back to menu</button>'
    );
    $("go").onclick = () => { initAudio(); SFX.pick(); startLevel(i); };
    $("back").onclick = titleScreen;
  }

  function gameOver(why) {
    G.state = "over"; stopMusic(); SFX.lose(); sheet.hidden = true; G.splice = null;
    const i = G.i;
    setTimeout(() => {
      show(
        '<div class="eyebrow">Job ' + (i + 1) + " · " + LEVELS[i].place + "</div>" +
        "<h2>Out of hard hats</h2>" +
        '<div class="speech">' + steveSVG + '<div><div class="who">Steve</div><p>' +
        (why === "time" ? "The phones at L3 Optics are ringing off the hook. Steve gets sent home to rest and try again." : "Bruised, wet and grumpy. Steve limps back to the van for a fresh hard hat and another go.") +
        "</p></div></div>" +
        '<div class="specs"><span>Score ' + G.score + "</span><span>Breaks fixed " + G.breaks.filter((b) => b.done).length + "/" + G.breaks.length + "</span></div>" +
        '<button class="cta" id="go">Try again</button><button class="cta ghost" id="back">Menu</button>'
      );
      $("go").onclick = () => startLevel(i);
      $("back").onclick = titleScreen;
    }, 700);
  }

  function levelComplete() {
    const i = G.i, L = G.L;
    const pr = G.splices ? G.perfect / G.splices : 0;
    const c1 = pr >= .5, c2 = G.hatsLost === 0;
    const starsN = 1 + (c1 ? 1 : 0) + (c2 ? 1 : 0);
    best[i] = Math.max(best[i] || 0, starsN); saveBest();
    const last = i === LEVELS.length - 1;
    const quips = [
      "Elm Road is glowing. Somebody cheers from a window. Steve pretends not to hear.",
      "Mill Lane is back online. Steve's boots are full of water and the dog is now his best friend.",
      "St. Lumen Hospital has full signal. The nurses send Steve a box of doughnuts."
    ];
    show(
      '<div class="eyebrow">Job ' + (i + 1) + " · " + L.place + "</div>" +
      "<h2>Link up!</h2>" +
      '<div class="stars">' + "★".repeat(starsN) + '<span class="off">' + "★".repeat(3 - starsN) + "</span></div>" +
      '<ul class="checks"><li class="y">All ' + G.breaks.length + " breaks fixed</li>" +
      '<li class="' + (c1 ? "y" : "") + '">At least half the splices PERFECT (' + G.perfect + "/" + G.splices + ")</li>" +
      '<li class="' + (c2 ? "y" : "") + '">No hard hats lost</li></ul>' +
      '<div class="specs"><span>Score ' + G.score + "</span><span>☕ " + G.coffee + "</span></div>" +
      '<div class="speech">' + steveSVG + '<div><div class="who">Steve</div><p>' + quips[i] + "</p></div></div>" +
      '<button class="cta" id="go">' + (last ? "Finish the shift" : "Next job") + "</button>" +
      '<button class="cta ghost" id="again">Replay for more stars</button>'
    );
    $("go").onclick = () => last ? endingScreen() : storyScreen(i + 1);
    $("again").onclick = () => startLevel(i);
  }

  function endingScreen() {
    const total = best.reduce((a, b) => a + (b || 0), 0);
    G = null;
    show(
      '<div class="brand">L3 Optics · Shift report</div>' +
      "<h1>Lumen Falls<span>is online</span></h1>" +
      '<div class="speech">' + steveSVG + '<div><div class="who">Steve Lamb</div><p>Eleven breaks, a dog, a digger and a lot of rain. The sun comes up over the van. Steve finally drinks his coffee. It is cold. Again.</p></div></div>' +
      '<div class="speech">' + dispatchSVG + "<div><div class=\"who\">Dispatch</div><p>Great work, Steve. Oh, and squirrels have eaten a cable on the industrial estate. Tomorrow, yeah?</p></div></div>" +
      levelGrid() +
      '<p class="small">Total stars: ' + total + " of " + LEVELS.length * 3 + ".</p>" +
      '<button class="cta" id="go">Back to menu</button>'
    );
    $("go").onclick = titleScreen;
  }

  // ---------- wiring ----------
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); jump(); });
  $("fuseBtn").addEventListener("pointerdown", (e) => { e.preventDefault(); fuse(); });
  $("scope").addEventListener("pointerdown", (e) => { e.preventDefault(); fuse(); });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") {
      if (!G) return;
      if (G.state === "run") { e.preventDefault(); jump(); }
      else if (G.state === "splice" && G.splice && G.splice.stage === "align") { e.preventDefault(); fuse(); }
    }
  });
  $("mute").addEventListener("click", () => { muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊"; });
  window.addEventListener("resize", resize);
  document.addEventListener("gesturestart", (e) => e.preventDefault());

  resize();
  titleScreen();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
