# Rebuilds the site just after midnight UK, so a "Peptyd dnia" entry written ahead appears on its own day.
name: codzienna przebudowa
on:
  schedule:
    - cron: '5 23 * * *'   # 00:05 UK in summer time
    - cron: '5 0 * * *'    # 00:05 UK in winter time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: PEP_OUT=. PEP_BASE=/ node tools/v4.js && node tools/es.js && node tools/szukaj.js
      - run: node tools/kontrola.js
      - name: commit
        run: |
          git config user.name "PepSafe"
          git config user.email "noreply@pepsafe.info"
          git add -A
          git diff --cached --quiet || (git commit -m "Daily rebuild" && git push)
