body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(14,9,5,.28),rgba(14,9,5,.62));pointer-events:none}
.gl{background:radial-gradient(260px circle at var(--mx,-999px) var(--my,-999px),rgba(255,255,255,.14),rgba(255,255,255,0) 62%),var(--g);border:1px solid var(--edge);border-radius:24px;backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);box-shadow:0 14px 44px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.26)}
@supports not (backdrop-filter:blur(1px)) and not (-webkit-backdrop-filter:blur(1px)){.gl{background:rgba(30,20,12,.86)}}
.app{position:relative;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px}
.rail{display:flex;flex-direction:column;gap:6px;align-items:center;padding:12px 8px;height:fit-content;position:sticky;top:14px;border-radius:30px}
.rail button{all:unset;box-sizing:border-box;cursor:pointer;position:relative;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--mut);transition:background .25s,color .25s,transform .2s}
.rail button:hover{background:var(--g2);color:#fff;transform:scale(1.06)}.rail button.on{background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 0 0 0 1px var(--edge)}
.rail button svg,.nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail button::after{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%) translateX(-6px);background:rgba(20,12,6,.92);color:#fff;font-size:12px;padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s;z-index:5;border:1px solid var(--edge)}
.rail button:hover::after,.rail button:focus-visible::after{opacity:1;transform:translateY(-50%)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--o);outline-offset:2px}
main{display:grid;gap:14px;min-width:0;align-content:start}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative}
.nav{position:relative;display:flex;padding:4px;border-radius:99px;max-width:100%;margin:0 auto}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;position:relative;z-index:1;display:flex;gap:7px;align-items:center;padding:9px 18px;border-radius:99px;font-size:13px;color:var(--mut);transition:color .25s}
